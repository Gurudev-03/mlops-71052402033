<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Result Predictor</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:560px;margin:40px auto;padding:0 18px;background:#f5f7fb;color:#172033}
    main{background:white;padding:28px;border-radius:14px;box-shadow:0 8px 30px #17203312}
    label{display:block;margin-top:16px;font-weight:600}
    input{box-sizing:border-box;width:100%;padding:11px;margin-top:6px;border:1px solid #ccd3df;border-radius:8px}
    button{margin-top:22px;padding:12px 18px;background:#2457d6;color:white;border:0;border-radius:8px;font-weight:700;cursor:pointer}
    .result{padding:12px;background:#e8f7ee;border-radius:8px;margin-top:18px;font-size:1.2rem}
    .error{padding:12px;background:#fff0ed;border-radius:8px;margin-top:18px}
    small{color:#566174}
  </style>
</head>
<body><main>
  <h1>Student Result Predictor</h1>
  <p>Enter student details to predict Pass or Fail.</p>
  <form method="post">
    <label for="study_hours">Study hours per day</label>
    <input id="study_hours" name="study_hours" type="number" min="0" max="24" step="0.1" required>
    <label for="attendance">Attendance (%)</label>
    <input id="attendance" name="attendance" type="number" min="0" max="100" step="0.1" required>
    <label for="internal_marks">Internal marks (out of 50)</label>
    <input id="internal_marks" name="internal_marks" type="number" min="0" max="50" step="0.1" required>
    <button type="submit">Predict result</button>
  </form>
  {% if prediction %}<div class="result"><strong>Prediction: {{ prediction }}</strong></div>{% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <p><small>Model Version: {{ model_version }}</small></p>
</main></body></html>
